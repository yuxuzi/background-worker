contract = 1
id = "worker"
name = "Background worker"
description = "An asyncio job worker with an in-memory queue: typed jobs, a concurrency limit, per-job timeouts, retries with backoff, a dead-letter list, and graceful shutdown on SIGINT and SIGTERM."
version = "1"
kind = "service"
status = "stable"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
default_components = []
optional_components = []
dependencies = []
questions = ["description", "author", "email", "python_version", "license"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
security_posture = "No secrets, network access, or services are needed: the demo and the tests use an in-memory queue, and the runtime uses only the standard library. Job payloads are untrusted input; the example handler validates its payload, and the worker does not sandbox handlers. Logs never include payloads, but dead letters keep exception messages, so handlers must not put secrets in them. The checks do not scan dependencies or code for security problems."

[dependency_groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
